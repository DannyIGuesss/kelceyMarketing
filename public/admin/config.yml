backend:
  name: github
  repo: DannyIGuesss/kelceyMarketing
  branch: main
  base_url: https://kelcey-marketing.vercel.app
  auth_endpoint: api/auth

publish_mode: editorial_workflow

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page"
        file: "content/home.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Line 1 (big text)", name: "line1", widget: "string" }
              - { label: "Script line", name: "script", widget: "string" }
              - { label: "Line 2 (big text)", name: "line2", widget: "string" }
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Stat Badge", name: "statBadge", widget: "string" }
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Services Teaser"
            name: "servicesTeaser"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Blurb", name: "blurb", widget: "text" }

  - name: "services"
    label: "Services Page"
    files:
      - name: "services"
        label: "Services Page"
        file: "content/services.json"
        fields:
          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Packages"
            name: "packages"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Onboarding"
            name: "onboarding"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Service Categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "experience"
    label: "Experience Page"
    files:
      - name: "experience"
        label: "Experience Page"
        file: "content/experience.json"
        fields:
          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Work Samples"
            name: "work"
            widget: "list"
            fields:
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Blurb 1", name: "blurb", widget: "text" }
              - { label: "Blurb 2", name: "blurb2", widget: "text" }
          - label: "Reviews Heading"
            name: "reviewsHeading"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Testimonials"
            name: "reviews"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Studio", name: "studio", widget: "string" }
